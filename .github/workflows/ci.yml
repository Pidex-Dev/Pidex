name: Project CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
      - name: Static quality checks
        if: steps.project.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          bun run version:check
          bun run typecheck
          bun run format:check
          bun run lint
          bun run arch:check
          bun run feature-map:check
          bun run desktop:css:check
          bun run --cwd packages/material-icon-theme sync:check
          bun run scripts/contracts/CheckLintRatchet.ts
      - name: Setup Java 21
        if: steps.project.outputs.run == 'true'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Cache tla2tools.jar
        if: steps.project.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: .tools/tla2tools.jar
          key: tla2tools-v1.7.4-936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
      - name: Download and verify tla2tools.jar
        if: steps.project.outputs.run == 'true'
        shell: bash
        env:
          TLA2TOOLS_URL: https://github.com/tlaplus/tlaplus/releases/download/v1.7.4/tla2tools.jar
          TLA2TOOLS_SHA256: 936a262061c914694dfd669a543be24573c45d5aa0ff20a8b96b23d01e050e88
        run: |
          set -euo pipefail
          mkdir -p .tools
          if [ ! -f .tools/tla2tools.jar ] || ! echo "${TLA2TOOLS_SHA256}  .tools/tla2tools.jar" | sha256sum -c --status -; then
            curl -fsSL "$TLA2TOOLS_URL" -o .tools/tla2tools.jar
            echo "${TLA2TOOLS_SHA256}  .tools/tla2tools.jar" | sha256sum -c -
          fi
      - name: Formal TLA+ checks
        if: steps.project.outputs.run == 'true'
        env:
          PIDEX_REQUIRE_TLC: '1'
        run: bun run formal:check
      - name: Governance tests
        if: steps.project.outputs.run == 'true'
        run: bun run test:governance
      - name: Whitespace check
        if: steps.project.outputs.run == 'true'
        shell: bash
        env:
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          git diff --check "$CI_BASE_SHA" HEAD

  unit-shards:
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
      - name: Unit tests
        if: steps.project.outputs.run == 'true'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: bun run test:unit --parallel=4 --shard=${{ matrix.shard }}/4

  unit-tests:
    if: always()
    needs: unit-shards
    runs-on: ubuntu-latest
    steps:
      - name: Require every shard
        env:
          RESULT: ${{ needs.unit-shards.result }}
        run: test "$RESULT" = success

  dependency-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
      - name: High and critical dependency audit
        if: steps.project.outputs.run == 'true'
        run: bun run security:audit
