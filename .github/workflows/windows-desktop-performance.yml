name: Windows desktop performance

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  renderer-observation:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
          workspace: '@pidex/renderer'
      - name: Renderer performance observation
        if: steps.project.outputs.run == 'true'
        run: bun scripts/performance/RunSuite.ts --suite=renderer
      - name: Upload renderer performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-observation-${{ github.run_attempt }}
          path: |
            performance-results/renderer/
            performance-results/raw/renderer/
            apps/desktop/renderer/test-results/performance/
          if-no-files-found: warn
          retention-days: 30

  packaged-electron:
    if: github.event_name != 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
      - name: Build Windows package
        if: steps.project.outputs.run == 'true'
        run: bun run package:win
      - name: Locate packaged executable
        if: steps.project.outputs.run == 'true'
        shell: pwsh
        run: |
          $executable = Get-ChildItem release -Recurse -Filter 'Pidex Desktop.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1
          if (-not $executable) {
            throw "Pidex Desktop.exe was not found in the unpacked package"
          }
          "PIDEX_PERF_EXECUTABLE=$($executable.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Packaged Electron performance
        if: steps.project.outputs.run == 'true'
        run: bun run perf:electron
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-performance
          path: performance-results/electron/
          if-no-files-found: warn
          retention-days: 30
