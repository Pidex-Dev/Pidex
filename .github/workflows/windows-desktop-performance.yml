name: Windows desktop performance

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  perf-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - name: Evaluate branch, title and label triggers
        id: quick
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == workflow_dispatch ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          head_ref_lower="${PR_HEAD_REF,,}"
          case "$head_ref_lower" in
            release/*|perf/*|codex/release*|codex/perf*)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          title_lower="${PR_TITLE,,}"
          case "$title_lower" in
            "chore(release)"*|release:*|release：*|"perf("*|perf:*|perf：*)
              echo 'run=true' >> "$GITHUB_OUTPUT"
              exit 0
              ;;
          esac

          labels_lower=",${PR_LABELS,,},"
          if [[ "$labels_lower" == *,release,* || "$labels_lower" == *,perf,* || "$labels_lower" == *,performance,* ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo 'run=false' >> "$GITHUB_OUTPUT"

      - name: Checkout for changed-path inspection
        if: steps.quick.outputs.run != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Evaluate performance path changes
        id: decide
        shell: bash
        env:
          QUICK_RUN: ${{ steps.quick.outputs.run }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [[ "$QUICK_RUN" == true ]]; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "$CI_BASE_SHA" ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --no-tags --depth=1 origin "$CI_BASE_SHA"
          changed="$(mktemp)"
          trap 'rm -f "$changed"' EXIT
          git diff --name-only -z "$CI_BASE_SHA" HEAD > "$changed"

          run=false
          while IFS= read -r -d '' file; do
            case "$file" in
              scripts/performance/*|apps/desktop/renderer/performance-tests/*|apps/desktop/electron/performance-tests/*|.github/workflows/windows-desktop-performance.yml)
                run=true
                break
                ;;
            esac
          done < "$changed"
          echo "run=$run" >> "$GITHUB_OUTPUT"

  renderer-observation:
    needs: perf-gate
    if: needs.perf-gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
        with:
          ignore-scripts: 'true'
          workspace: '@pidex/renderer'
      - name: Renderer performance observation
        if: steps.project.outputs.run == 'true'
        run: bun scripts/performance/RunSuite.ts --suite=renderer
      - name: Upload renderer performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: renderer-observation-${{ github.run_attempt }}
          path: |
            performance-results/renderer/
            performance-results/raw/renderer/
            apps/desktop/renderer/test-results/performance/
          if-no-files-found: warn
          retention-days: 30

  packaged-electron:
    needs: perf-gate
    if: needs.perf-gate.outputs.run == 'true'
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare project
        id: project
        uses: ./.github/actions/setup-project
      - name: Build Windows package
        if: steps.project.outputs.run == 'true'
        run: bun run package:win
      - name: Locate packaged executable
        if: steps.project.outputs.run == 'true'
        shell: pwsh
        run: |
          $executable = Get-ChildItem release -Recurse -Filter 'Pidex Desktop.exe' |
            Where-Object { $_.FullName -match 'win-unpacked' } |
            Select-Object -First 1
          if (-not $executable) {
            throw "Pidex Desktop.exe was not found in the unpacked package"
          }
          "PIDEX_PERF_EXECUTABLE=$($executable.FullName)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Packaged Electron performance
        if: steps.project.outputs.run == 'true'
        run: bun run perf:electron
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop-performance-${{ github.run_attempt }}
          path: |
            performance-results/electron/
            performance-results/raw/electron/
            apps/desktop/electron/test-results/performance/
          if-no-files-found: warn
          retention-days: 30
